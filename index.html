<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💘 Valentine?</title>
  <style>
    :root { --bg1:#bc3141; --bg2:#d37e89; }

    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      color:#222;
      padding: 22px;
      overflow-x:hidden;
    }

    .card{
      width:min(560px, 95vw);
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 22px;
      padding: 18px 18px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
      text-align:center;
      position: relative;
      overflow: hidden;
    }

    .photo{
      width: 100%;
      max-height: 330px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      margin-bottom: 14px;
    }

    h1{
      margin: 10px 0 10px;
      font-size: clamp(24px, 4.2vw, 34px);
      line-height: 1.15;
    }

    p{
      margin: 0 0 16px;
      font-size: 18px;
    }

    .btns{
      display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
      margin-top: 6px;
      position: relative;
      min-height: 54px;
    }

    button{
      border:0; border-radius: 999px; padding: 12px 18px;
      font-size: 16px; font-weight: 700; cursor:pointer;
      transition: transform .08s ease, box-shadow .08s ease, opacity .2s ease;
      user-select:none;
    }
    button:active{ transform: scale(.98); }

    #yesBtn{
      background: #da4762ea; color:white;
      box-shadow: 0 12px 28px rgba(255,45,85,.35);
    }
    #noBtn{
      background: #111; color:white;
      box-shadow: 0 12px 28px rgba(0,0,0,.2);
      position: relative;
    }

    .result{
      margin-top: 18px;
      font-size: 20px;
      font-weight: 800;
      display:none;
    }

    /* Heart confetti */
    .heart{
      position: fixed;
      top: -24px;
      font-size: 22px;
      pointer-events: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.18));
      z-index: 9999;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0.95; }
    }

    /* Optional small link box */
    .shareRow{
      margin-top: 14px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }
    input{
      width:min(420px, 95%);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.15);
      font-size: 14px;
      background: rgba(255,255,255,.92);
    }
    .copyBtn{
      background:#fff;
      color:#111;
      border:1px solid rgba(0,0,0,.15);
      box-shadow:none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      cursor:pointer;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="photo" src="couple.jpg" alt="Us 💞" />

    <h1 id="title">Hi bé Minh, will you be my Valentine? 💘</h1>
    <p id="subtitle">YES YES YES YES....🤍🐵</p>

    <div class="btns" id="btns">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😭</button>
    </div>

    <div class="result" id="result">See you on Valentine at 8pm, Iu em nhiều nhắm  ❤️</div>

    <!-- Music (plays after she clicks Yes) -->
    <audio id="music" preload="auto">
      <source src="love.mp3" type="audio/mpeg" />
    </audio>

    <!-- Optional: shows the exact link you can send -->
    <div class="shareRow">
      <input id="shareLink" readonly />
      <button class="copyBtn" id="copyBtn">Copy link</button>
    </div>
  </main>

  <script>
    // 1) Name in URL: ?to=Minh (or bé%20Minh)
    const params = new URLSearchParams(location.search);
    const to = params.get("to") || "bé Minh";

    const title = document.getElementById("title");
    title.textContent = `Hi ${to}, elm coá mún spend Valentine zới tui hăm? 💘`;

    // Show a ready-to-send URL (works after hosting)
    const shareLink = document.getElementById("shareLink");
    shareLink.value = location.href;

    document.getElementById("copyBtn").onclick = async () => {
      try {
        await navigator.clipboard.writeText(shareLink.value);
        const btn = document.getElementById("copyBtn");
        btn.textContent = "Copied ✅";
        setTimeout(()=> btn.textContent = "Copy link", 1200);
      } catch {
        shareLink.select();
        document.execCommand("copy");
      }
    };

    // 2) Music + 3) Heart confetti on YES
    const result = document.getElementById("result");
    const btns = document.getElementById("btns");
    const subtitle = document.getElementById("subtitle");
    const music = document.getElementById("music");

    function burstHearts(count = 40) {
      const hearts = ["🤍","🤍","🤍","🤍","🤍","💙"];
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "heart";
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];

        const left = Math.random() * 100;           // vw
        const size = 16 + Math.random() * 18;       // px
        const duration = 2.2 + Math.random() * 2.2; // seconds
        const drift = (Math.random() * 80) - 40;    // px drift

        el.style.left = left + "vw";
        el.style.fontSize = size + "px";
        el.style.animationDuration = duration + "s";
        el.style.transform = `translateX(${drift}px)`;

        document.body.appendChild(el);
        setTimeout(() => el.remove(), (duration + 0.2) * 1000);
      }
    }

    document.getElementById("yesBtn").onclick = async () => {
      result.style.display = "block";
      btns.style.display = "none";
      subtitle.textContent = "Hẹ Hẹ 💞";

      // hearts
      burstHearts(50);
      setTimeout(() => burstHearts(35), 350);
      setTimeout(() => burstHearts(25), 750);

      // music (allowed because this is triggered by a click)
      try {
        music.currentTime = 0;
        await music.play();
      } catch (e) {
        // If autoplay is blocked, user can tap play in browser controls if needed
        console.log("Audio play blocked:", e);
      }
    };

    // Cute "No" button dodge
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseenter", () => {
      const card = document.querySelector(".card").getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const maxX = card.width - btn.width - 24;
      const maxY = card.height - btn.height - 24;

      const x = Math.max(12, Math.min(maxX, Math.random() * maxX));
      const y = Math.max(12, Math.min(maxY, Math.random() * maxY));

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    });
  </script>
</body>
</html>
